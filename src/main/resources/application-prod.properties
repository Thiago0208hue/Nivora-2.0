# Perfil de produção: ativar com SPRING_PROFILES_ACTIVE=prod (exige HTTPS)
server.servlet.session.cookie.secure=true
# Não revelar detalhes de erros ao cliente
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# Atrás do Caddy (proxy): usar o IP real do visitante (o limitador de login depende disso)
server.forward-headers-strategy=framework
# Só o proxy, na mesma máquina, alcança a aplicação; nunca expor a porta 8080 na internet
server.address=127.0.0.1
