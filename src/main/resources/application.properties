spring.application.name=nivora

# Credenciais vêm de variáveis de ambiente (nunca no GitHub)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/nivora?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

# O esquema é criado pelas migrações do Flyway (db/migration);
# o Hibernate apenas confere se as entidades batem com as tabelas
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
