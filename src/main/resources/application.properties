spring.application.name=nivora

# Credenciais vêm de variáveis de ambiente (nunca no GitHub)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/nivora?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

# O esquema será controlado por migrações (Etapa 2), não pelo Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
