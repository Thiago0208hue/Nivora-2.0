<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Treinar — Nivora</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<header class="site-header">
  <div class="container header-inner">
    <a href="/" class="logo">Nivora</a>
    <nav class="main-nav app-nav">
      <a href="/pages/dashboard.html">Dashboard</a>
      <a href="/pages/plano.html">Meu Plano</a>
      <a href="/pages/assuntos.html">Assuntos</a>
      <a href="/pages/treinar.html">Treinar</a>
      <a href="/pages/desempenho.html">Desempenho</a>
      <a href="/pages/redacao.html">Redação</a>
      <a href="/pages/metas.html">Metas</a>
      <a href="/pages/configuracoes.html">Configurações</a>
    </nav>
    <div class="header-actions">
      <button id="themeToggle" class="icon-btn" aria-label="Alternar tema claro/escuro">🌙</button>
    </div>
  </div>
</header>

<main class="container page" id="treinarApp">
  <h1 class="section-title">Treinar</h1>

  <div class="filtros" id="modos">
    <button class="btn btn-primary" data-modo="pratica">Prática livre</button>
    <button class="btn" data-modo="simulado">Simulado</button>
    <button class="btn" data-modo="revisao">Revisar erros</button>
  </div>

  <div id="painelPratica" class="filtros">
    <select id="filtroArea">
      <option value="">Todas as áreas</option>
      <option value="MATEMATICA">Matemática</option>
      <option value="NATUREZA">Ciências da Natureza</option>
      <option value="LINGUAGENS">Linguagens</option>
      <option value="HUMANAS">Ciências Humanas</option>
    </select>
    <select id="filtroMateria"><option value="">Todas as matérias</option></select>
    <select id="filtroAssunto"><option value="">Todos os assuntos</option></select>
    <select id="filtroDificuldade">
      <option value="">Qualquer dificuldade</option>
      <option value="FACIL">Fácil</option>
      <option value="MEDIO">Médio</option>
      <option value="DIFICIL">Difícil</option>
    </select>
    <select id="filtroAno" style="display:none"><option value="">Qualquer ano</option></select>
    <select id="filtroQuantidade">
      <option value="5">5 questões</option>
      <option value="10" selected>10 questões</option>
      <option value="20">20 questões</option>
    </select>
    <button class="btn btn-primary" id="btnComecar">Começar</button>
  </div>

  <div id="painelSimulado" class="filtros" style="display:none">
    <select id="simTipo">
      <option value="COMPLETO">Completo (todas as áreas)</option>
      <option value="AREA">Por área</option>
    </select>
    <select id="simArea" style="display:none">
      <option value="MATEMATICA">Matemática</option>
      <option value="NATUREZA">Ciências da Natureza</option>
      <option value="LINGUAGENS">Linguagens</option>
      <option value="HUMANAS">Ciências Humanas</option>
    </select>
    <select id="simQuantidade">
      <option value="8">8 questões</option>
      <option value="16">16 questões</option>
      <option value="30">30 questões</option>
    </select>
    <button class="btn btn-primary" id="btnSimulado">Iniciar simulado</button>
  </div>

  <p class="hint" id="avisoOrigem"></p>
  <div id="quizArea"></div>
  <div id="resultado"></div>
</main>

<nav class="bottom-nav">
  <a href="/pages/dashboard.html"><span>🏠</span>Dashboard</a>
  <a href="/pages/plano.html"><span>🗓️</span>Plano</a>
  <a href="/pages/assuntos.html"><span>📚</span>Assuntos</a>
  <a href="/pages/treinar.html" class="active"><span>✍️</span>Treinar</a>
  <a href="/pages/desempenho.html"><span>📊</span>Desempenho</a>
  <a href="/pages/redacao.html"><span>📝</span>Redação</a>
  <a href="/pages/metas.html"><span>🎯</span>Metas</a>
  <a href="/pages/configuracoes.html"><span>⚙️</span>Config</a>
</nav>

<script src="/js/api.js"></script>
<script src="/js/storage.js"></script>
<script src="/js/data.js"></script>
<script src="/js/app.js"></script>
<script src="/js/treinar.js"></script>
</body>
</html>
